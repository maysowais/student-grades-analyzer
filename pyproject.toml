[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grades-analyzer"
version = "1.0.0"
description = "Analyze a class gradebook (CSV or Excel) and produce reports, charts and a follow-up list."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mays Owais" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grades-analyzer = "grades_analyzer.cli:main"

[tool.setuptools]
packages = ["grades_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
